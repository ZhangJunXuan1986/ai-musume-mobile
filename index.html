<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 浏览器级缩放交给页面本身；H5 不再有 pygbag/WASM 的 canvas 坐标换算问题 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d1a">
<link rel="icon" href="data:,">
<title>AI娘大乱斗 · 手机版</title>
<style>
/* ==========================================================================
   AI娘大乱斗 手机版 H5 —— 样式表
   核心原则：按键是【真实 DOM 元素】，尺寸按 CSS 像素 / vmin 定义，
   与 canvas 的绘制缩放完全解耦。手机上不再把 1280×720 的 PC 布局整体缩小，
   所以圆键能真正做到 56~76px、胶囊 ≥48px，天然满足触摸最小目标。
   ========================================================================== */
:root{
  /* ① 手机按键尺寸：想调大小只改这几行，单位都是真实 CSS 像素 */
  --pad: clamp(10px, 1.8vmin, 20px);          /* 屏幕边缘留白 */
  --rk:  clamp(56px, 8.6vmin, 78px);          /* 技能圆键直径 */
  --atk: clamp(74px, 11.2vmin, 102px);        /* 普攻大圆直径 */
  --ult: clamp(60px, 9.2vmin, 84px);          /* 奥义金圆直径 */
  --stick: clamp(116px, 17vmin, 156px);       /* 固定摇杆底盘 */
  --capw: clamp(76px, 11vmin, 100px);         /* 功能胶囊宽 */
  --caph: clamp(46px, 6.8vmin, 58px);         /* 功能胶囊高（≥44 触摸底线） */
  --gap: 8px;
  --p1:#56c4ff; --p2:#ff8a60; --gold:#ffd060;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0d1a;
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color:#eef0ff;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;overflow:hidden;touch-action:none}

/* ---- 战斗画面：铺满屏幕；内部逻辑坐标 1280×720 只用于绘制，不影响 DOM 按键 ---- */
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---- 顶部 HUD ---- */
#hud{position:absolute;left:0;right:0;top:0;z-index:6;pointer-events:none;
  padding:calc(6px + env(safe-area-inset-top,0px)) calc(var(--pad) + env(safe-area-inset-right,0px)) 0
          calc(var(--pad) + env(safe-area-inset-left,0px));
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.side{flex:1;max-width:42%}
.side .nm{font-size:clamp(12px,1.9vmin,17px);font-weight:700;letter-spacing:.5px;
  text-shadow:0 1px 4px #000;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:clamp(9px,1.5vmin,14px);border-radius:8px;background:#1b1f3c;border:1px solid #3a4070;overflow:hidden}
.bar > i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#60e28c,#a8f0b8);transition:width .12s linear}
.side.r .bar > i{background:linear-gradient(90deg,#ff7b6b,#ffb199)}
.rage{display:flex;gap:4px;margin-top:5px}
.rage > b{flex:1;height:clamp(6px,1vmin,10px);border-radius:3px;background:#242848;border:1px solid #454b7d}
.rage > b.on{background:linear-gradient(90deg,#ffc448,#ff6060);box-shadow:0 0 8px #ff9a48}
#clock{font-size:clamp(18px,3vmin,30px);font-weight:800;color:var(--gold);
  text-shadow:0 2px 8px #000;min-width:2.4em;text-align:center;line-height:1.1}
#meta{font-size:clamp(10px,1.5vmin,13px);color:#aab0d8;text-align:center;white-space:nowrap;
  text-shadow:0 1px 3px #000}
#skillbar{position:absolute;left:50%;transform:translateX(-50%);z-index:6;pointer-events:none;
  top:calc(58px + env(safe-area-inset-top,0px));max-width:70%;text-align:center;
  font-size:clamp(10px,1.6vmin,14px);color:#dfe4ff;background:rgba(12,15,34,.72);
  border:1px solid rgba(120,140,220,.35);border-radius:20px;padding:5px 14px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#skillbar b{color:var(--gold)}

/* ---- 左下：固定摇杆（底盘不动，只有头跟手指） ---- */
#pad{position:absolute;z-index:8;
  left:calc(var(--pad) + env(safe-area-inset-left,0px));
  bottom:calc(var(--pad) + env(safe-area-inset-bottom,0px));
  width:var(--stick);height:var(--stick);border-radius:50%;
  background:radial-gradient(circle at 50% 45%,rgba(30,40,80,.72),rgba(10,14,34,.82));
  border:2px solid rgba(120,170,245,.55);box-shadow:0 0 22px rgba(60,120,220,.22) inset;
  touch-action:none}
#pad::after{content:"移动";position:absolute;left:0;right:0;bottom:-20px;text-align:center;
  font-size:11px;color:#9aa4d0}
#knob{position:absolute;left:50%;top:50%;width:44%;height:44%;border-radius:50%;
  transform:translate(-50%,-50%);background:rgba(110,200,255,.9);
  border:2px solid #e8f6ff;box-shadow:0 0 14px rgba(90,190,255,.6)}

/* ---- 左下摇杆右侧：2×2 功能胶囊（跳 / 闪避 / 净化 / 秘卷） ---- */
#funcs{position:absolute;z-index:8;display:grid;grid-template-columns:repeat(2,var(--capw));
  grid-auto-rows:var(--caph);gap:var(--gap);
  left:calc(var(--pad) * 2 + var(--stick) + env(safe-area-inset-left,0px));
  bottom:calc(var(--pad) + env(safe-area-inset-bottom,0px))}
.cap{display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:14px;border:2px solid rgba(120,150,220,.6);
  background:rgba(18,24,52,.82);font-size:clamp(12px,1.9vmin,16px);font-weight:700;
  line-height:1.15;text-align:center;touch-action:none;color:#eef0ff}
.cap small{font-size:clamp(9px,1.3vmin,12px);color:#ffd060;font-weight:600}
.cap.hot{background:rgba(56,84,150,.92)}
.cap.cd{opacity:.5;filter:grayscale(.6)}

/* ---- 右下：火影手游式技能簇（普攻大圆 + 3 技能圆 + 金色奥义） ---- */
#keys{position:absolute;z-index:8;
  right:calc(var(--pad) + env(safe-area-inset-right,0px));
  bottom:calc(var(--pad) + env(safe-area-inset-bottom,0px));
  width:calc(var(--atk) + var(--rk) * 2 + var(--gap) * 2);
  /* 高度 = 普攻 + 奥义 + 间距，保证两个上下相邻的圆键留出 8px 不相交 */
  height:calc(var(--atk) + var(--ult) + var(--gap))}
.rk{position:absolute;border-radius:50%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  border:3px solid rgba(140,190,255,.85);background:rgba(16,22,50,.86);
  font-weight:800;font-size:clamp(13px,2.1vmin,18px);line-height:1.1;
  box-shadow:0 3px 12px rgba(0,0,0,.45);touch-action:none;color:#eaf2ff}
.rk small{display:block;font-size:clamp(9px,1.3vmin,12px);color:var(--gold);font-weight:600;margin-top:2px}
.rk.hot{background:rgba(60,90,165,.95);transform:scale(.95)}
.rk.cd{opacity:.46;filter:grayscale(.7)}
/* CD 数字居中显示；冷却/缺气时隐藏键面文字，避免「奥义 + L + 气不足」糊成一团 */
.rk .cdnum{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  text-align:center;pointer-events:none;font-size:clamp(13px,2vmin,18px);
  color:#ff9a9a;font-weight:800}
.rk.cd{color:transparent}
.rk.cd small,.rk.cd .lab{visibility:hidden}
.rk.cd .cdnum{visibility:visible}
#b_atk{right:0;bottom:0;width:var(--atk);height:var(--atk);
  border-color:rgba(200,220,255,.95);font-size:clamp(15px,2.4vmin,21px)}
#b_ult{right:0;top:0;width:var(--ult);height:var(--ult);
  border-color:var(--gold);background:rgba(64,44,16,.9);color:var(--gold)}
#b_s1{right:calc(var(--atk) + var(--gap));bottom:0;width:var(--rk);height:var(--rk)}
#b_s2{right:calc(var(--atk) + var(--gap));bottom:calc(var(--rk) + var(--gap));width:var(--rk);height:var(--rk)}
#b_s3{right:calc(var(--atk) + var(--rk) + var(--gap) * 2);bottom:calc(var(--rk) + var(--gap));
  width:var(--rk);height:var(--rk)}
/* 奥义与 s2/s3 在窄屏可能相碰：给簇一个最小高度并保证不相交 */
@media (max-height:430px){:root{--rk:clamp(54px,8vmin,70px);--atk:clamp(70px,10.5vmin,92px)}}

/* ---- 右上角：菜单 / 暂停（原来挤在中间的 5 个按钮全部收进这里） ---- */
/* 竖排放在 HUD 与右下按键之间的右侧空档：不挡血条、不挡技能键、不占中间画面 */
#topbtns{position:absolute;z-index:9;right:calc(var(--pad) + env(safe-area-inset-right,0px));
  top:calc(96px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px}
.tb{min-width:48px;height:48px;padding:0 12px;border-radius:14px;
  border:2px solid rgba(130,155,225,.6);background:rgba(18,24,52,.86);
  color:#eef0ff;font-size:clamp(12px,1.8vmin,15px);font-weight:700;touch-action:manipulation}
.tb.hot{background:rgba(60,90,165,.95)}

/* ---- 覆盖层：主页面 / 说明 / 联机 / 战绩 / 结算 ---- */
.ov{position:absolute;inset:0;z-index:30;background:rgba(8,11,26,.9);
  display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.ov[hidden]{display:none}
.card{width:min(680px,94vw);max-height:92vh;overflow:auto;background:#151a38;
  border:1px solid #39437c;border-radius:20px;padding:20px 22px;
  box-shadow:0 18px 60px rgba(0,0,0,.6)}
.card h1{margin:0 0 4px;font-size:clamp(22px,4vmin,34px);text-align:center;color:#fff}
.card h2{font-size:clamp(15px,2.3vmin,20px);margin:16px 0 8px;color:var(--gold)}
.card .sub{text-align:center;color:#aab2dd;font-size:clamp(11px,1.8vmin,14px);margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}
.btn{flex:1 1 auto;min-height:48px;min-width:96px;padding:10px 14px;border-radius:14px;
  border:2px solid #46529a;background:#222a55;color:#eef0ff;font-size:clamp(13px,2vmin,16px);
  font-weight:700;touch-action:manipulation}
.btn.pri{background:linear-gradient(90deg,#3a63c8,#5f8cf0);border-color:#8fb4ff}
.btn.warn{background:#5a2a34;border-color:#c07078}
.btn.on{outline:3px solid var(--gold)}
.chip{min-height:44px;padding:8px 12px;border-radius:12px;border:2px solid #3c4683;
  background:#1c2348;color:#dfe4ff;font-size:clamp(11px,1.7vmin,14px);font-weight:600}
.chip.on{background:#3b5bb0;border-color:var(--gold);color:#fff}
.kv{font-size:clamp(11px,1.8vmin,14px);color:#c9d0f5;line-height:1.7}
.kv b{color:var(--gold)}
textarea{width:100%;min-height:74px;background:#0e1330;color:#dfe6ff;border:1px solid #3c4683;
  border-radius:10px;padding:8px;font-size:12px;resize:vertical}
.hint{font-size:clamp(10px,1.6vmin,13px);color:#9aa4d0;line-height:1.6;margin-top:8px}
.close{position:sticky;top:0;float:right;min-width:48px;height:48px;border-radius:12px;
  border:2px solid #5a64a8;background:#2a3266;color:#fff;font-size:18px;font-weight:800}
#toast{position:absolute;z-index:40;left:50%;top:30%;transform:translateX(-50%);
  background:rgba(12,16,38,.94);border:1px solid var(--gold);border-radius:16px;
  padding:10px 20px;font-size:clamp(13px,2vmin,17px);font-weight:700;color:var(--gold);
  pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
#toast.show{opacity:1}
/* 竖屏提示：小胶囊、不吃点击、不覆盖画面（吸取之前 WASM 版的教训） */
#rotate{position:absolute;z-index:20;left:50%;top:calc(6px + env(safe-area-inset-top,0px));
  transform:translateX(-50%);display:none;pointer-events:none;
  background:rgba(11,13,28,.88);color:var(--gold);border:1px solid rgba(255,208,96,.5);
  border-radius:20px;padding:7px 16px;font-size:13px;font-weight:700;white-space:nowrap}
@media (orientation:portrait) and (max-width:900px){#rotate{display:block}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="side"><div class="nm" id="n1">P1</div><div class="bar"><i id="hp1"></i></div>
      <div class="rage" id="rg1"><b></b><b></b><b></b></div></div>
    <div style="text-align:center"><div id="clock">60</div><div id="meta"></div></div>
    <div class="side r" style="text-align:right"><div class="nm" id="n2">P2</div>
      <div class="bar"><i id="hp2"></i></div><div class="rage" id="rg2"><b></b><b></b><b></b></div></div>
  </div>
  <div id="skillbar"></div>

  <div id="pad"><div id="knob"></div></div>
  <div id="funcs">
    <div class="cap" data-act="jump">跳<small>K</small></div>
    <div class="cap" data-act="dodge">闪避<small>Q</small></div>
    <div class="cap" data-act="cleanse">净化<small>E</small></div>
    <div class="cap" data-act="scroll">秘卷<small>Z</small></div>
  </div>

  <div id="keys">
    <div class="rk" id="b_s3" data-act="s3"><span class="lab">技3</span><small>O</small><span class="cdnum"></span></div>
    <div class="rk" id="b_s2" data-act="s2"><span class="lab">技2</span><small>I</small><span class="cdnum"></span></div>
    <div class="rk" id="b_s1" data-act="s1"><span class="lab">技1</span><small>U</small><span class="cdnum"></span></div>
    <div class="rk" id="b_ult" data-act="ult"><span class="lab">奥义</span><small>L</small><span class="cdnum"></span></div>
    <div class="rk" id="b_atk" data-act="atk"><span class="lab">普攻</span><small>J</small><span class="cdnum"></span></div>
  </div>

  <div id="topbtns">
    <button class="tb" id="btnPause">暂停</button>
    <button class="tb" id="btnMenu">菜单</button>
  </div>

  <div id="rotate">请把手机横过来玩（竖屏也能继续）</div>
  <div id="toast"></div>

  <!-- 主页面 -->
  <div class="ov" id="ovMenu"><div class="card">
    <button class="close" data-close="ovMenu">×</button>
    <h1>AI娘大乱斗</h1><div class="sub">手机版 · 一人一屏 · 房间码可联网 1v1</div>
    <div class="row"><button class="btn pri" id="btnStart">开始对战</button>
      <button class="btn" id="btnNet">房间码联机</button></div>
    <h2>模式</h2>
    <div class="row" id="modeRow">
      <button class="chip on" data-mode="solo">单人 PVE（电脑）</button>
      <button class="chip" data-mode="online">联网 1v1</button>
    </div>
    <h2>我的角色 <span class="kv" id="charName"></span></h2>
    <div class="row" id="charRow"></div>
    <h2>场地 / 机制 / 秘卷</h2>
    <div class="row" id="arenaRow"></div>
    <div class="row" id="effRow"></div>
    <div class="row" id="scrollRow"></div>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="btnHelp">操作说明</button>
      <button class="btn" id="btnStats">P1 / P2 战绩</button>
      <button class="btn warn" id="btnClear">清空战绩</button></div>
    <div class="hint" id="menuHint"></div>
  </div></div>

  <!-- 操作说明 -->
  <div class="ov" id="ovHelp" hidden><div class="card">
    <button class="close" data-close="ovHelp">×</button>
    <h1>操作说明</h1>
    <div class="sub">按键按真实手机像素画，不再从电脑布局缩小</div>
    <div class="kv" id="helpBody"></div>
  </div></div>

  <!-- 联机 -->
  <div class="ov" id="ovNet" hidden><div class="card">
    <button class="close" data-close="ovNet">×</button>
    <h1>房间码联机</h1>
    <div class="sub">两台手机各管各的角色，不再挤在同一块屏幕上</div>
    <div class="row"><button class="btn pri" id="btnHost">创建房间</button>
      <button class="btn" id="btnJoin">加入房间</button></div>
    <div class="row"><input id="roomCode" class="chip" style="flex:1;min-height:48px;background:#0e1330;
      color:#fff;letter-spacing:3px;text-transform:uppercase" placeholder="4 位房间码" maxlength="4"></div>
    <div class="kv" id="netStatus">未连接</div>
    <h2>高级：无 Worker 时手动交换</h2>
    <div class="hint">若没部署信令服务，可把「本机码」发给对方、把「对方码」粘进来，点对点直连。</div>
    <div class="row"><textarea id="sdpOut" placeholder="本机码（点创建/加入后生成）"></textarea></div>
    <div class="row"><textarea id="sdpIn" placeholder="粘贴对方码"></textarea>
      <button class="btn" id="btnSdp">应用对方码</button></div>
  </div></div>

  <!-- 战绩 -->
  <div class="ov" id="ovStats" hidden><div class="card">
    <button class="close" data-close="ovStats">×</button>
    <h1>P1 / P2 战绩</h1><div class="kv" id="statsBody"></div>
  </div></div>

  <!-- 结算 -->
  <div class="ov" id="ovOver" hidden><div class="card">
    <h1 id="overTitle">对局结束</h1>
    <div class="sub" id="overSub"></div>
    <div class="row"><button class="btn pri" id="btnAgain">再战一局</button>
      <button class="btn" id="btnBack">回主页面</button></div>

  ICE: [{ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }],
  // 对战快照发送间隔（host → guest，单位帧）
  SNAP_EVERY: 2,
  // 本机战绩存档键

// ======================== 工具函数 ========================
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const now = () => performance.now();
const rgb = a => 'rgb(' + a[0] + ',' + a[1] + ',' + a[2] + ')';
const rgba = (a, k) => 'rgba(' + a[0] + ',' + a[1] + ',' + a[2] + ',' + k + ')';
function toast(msg, ms) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms || 1700);
}
function spec(cid, slot) {
  // 与电脑版 skill_spec 一致：基础值 + 角色自定义覆盖
  const base = Object.assign({}, RULES.skill_base[slot] || RULES.skill_base.s1);
  const kit = RULES.skill_kits[cid] || RULES.skill_kits.deepseek;
  return Object.assign(base, (kit.skills && kit.skills[slot]) || {});
}
function kitOf(cid) { return RULES.skill_kits[cid] || RULES.skill_kits.deepseek; }
function shortName(cid, slot) {
  const n = (RULES.skill_short[cid] || {})[slot];
  return n || (spec(cid, slot).name || '技能').slice(0, 3);
}

// ======================== 全局状态 ========================
const S = {
  scene: 'menu',            // menu / game / over
  mode: CFG.DEFAULT_MODE,   // solo / online
  charIdx: 0, p2CharIdx: 1,
  arenaIdx: 0, effect: 'none', scrollName: '霸体',
  paused: false, over: false, winner: 0, t: 0, timeLeft: CFG.ROUND_SEC,
  f: [null, null],          // [P1, P2]
  proj: [], fx: [], floats: [], particles: [],
  input: { dir: 0, up: false, down: false },
  aiTick: 0, aiCache: { held: 0, acts: [] },

  netEvents: [],            // host 本帧产生的浮字，随快照下发，guest 也能看到技能名/伤害

};

// ======================== 战绩（localStorage） ========================
function blankSide() { return { matches: 0, wins: 0, dmg: 0, maxCombo: 0, chars: {}, recent: [] }; }
function loadStats() {
  try {
    const s = JSON.parse(localStorage.getItem(CFG.STATS_KEY));
    if (s && s.P1 && s.P2) return s;
  } catch (e) { /* 隐私模式下不可用，退回内存 */ }
  return { P1: blankSide(), P2: blankSide() };
}
function saveStats() { try { localStorage.setItem(CFG.STATS_KEY, JSON.stringify(S.stats)); } catch (e) {} }
function recordMatch(w) {
  const st = S.stats;
  ['P1', 'P2'].forEach((k, i) => {
    const side = st[k], f = S.f[i];
    side.matches++; if (w === i + 1) side.wins++;
    side.dmg += Math.round(f.dmgDone || 0);
    side.maxCombo = Math.max(side.maxCombo, f.maxCombo || 0);
    const cid = f.cid; side.chars[cid] = (side.chars[cid] || 0) + 1;
    side.recent.unshift({ w: w, cid: cid, t: Date.now() });
    side.recent = side.recent.slice(0, 8);
  });
  saveStats();
}

// ======================== 角色实体 ========================
function makeF(side, cid, x) {
  const ch = RULES.characters.find(c => c.id === cid) || RULES.characters[0];
  const maxHp = C.BASE_HP * (ch.stats.hp || 1);
  return {
    side: side, cid: cid, ch: ch, x: x, y: C.GROUND_Y, vx: 0, vy: 0,
    hp: maxHp, maxHp: maxHp, rage: 0, facing: side === 1 ? 1 : -1,
    state: 'idle', stateT: 0, guard: false, invuln: 0, hurtT: 0,
    cd: { s1: 0, s2: 0, s3: 0, ult: 0, atk: 0 },
    dodgeCd: 0, dodgeInv: 0, cleanseCd: 0, scrollCd: 0,
    busy: 0, status: {}, mark: 0, charged: 0, idleT: 0, lastHitT: -999,
    combo: 0, comboT: 0, maxCombo: 0, dmgDone: 0,
    pending: [], transform: false, atkHit: false, atkKind: '',
    passiveT: 0, passiveCd: 0,
  };
}
function other(f) { return S.f[f.side === 1 ? 1 : 0]; }
function canAct(f) { return !f.status.stun && !f.status.sleep && f.hp > 0; }
function canSkill(f) { return canAct(f) && !f.status.silence; }
function addStatus(f, name, frames, val) {
  if ((name === 'stun' || name === 'slow' || name === 'silence' || name === 'sleep' || name === 'mark')
      && f.status.cleanse_immune) return false;
  f.status[name] = Math.max(f.status[name] || 0, frames | 0);
  if (val) f.status[name + '_v'] = val;
  return true;
}
function has(f, n) { return (f.status[n] || 0) > 0; }

// ======================== 战斗：伤害 / 技能 / 状态 ========================
function damageOf(src, sp) {
  let d = (sp.dmg || 50);
  if (has(src, 'buff_atk')) d *= 1 + (src.status.buff_atk_v || 0.25);
  const kit = kitOf(src.cid);
  if (kit.passive.type === 'full_rage_bonus' && src.rage >= C.RAGE_MAX) d *= 1 + kit.passive.val;
  if (src.charged > 0) { d *= 1 + kit.passive.val; src.charged = 0; }
  if (src.transform) d *= 1.35;
  return d;
}
function hit(src, dst, dmg, opt) {
  opt = opt || {};
  if (dst.invuln > 0 || dst.hp <= 0) return false;
  if (dst.dodgeInv > 0) {                       // 闪避成功：回气
    src.rage = clamp(src.rage + 0, 0, C.RAGE_MAX);
    dst.rage = clamp(dst.rage + 8, 0, C.RAGE_MAX);
    floatAt(dst.x, dst.y - 130, '闪避', [140, 235, 255]);
    return false;
  }
  // 被动：宪法减伤（单次超过 120 的部分减 val）
  const pk = kitOf(dst.cid).passive;
  if (pk.type === 'damage_cap' && dmg > 120) dmg = 120 + (dmg - 120) * (1 - pk.val);
  if (has(dst, 'super_armor') && opt.pierceArmor) dmg *= 1.2;
  if (dst.guard && !opt.breakGuard) dmg *= 0.1;
  if (has(dst, 'buff_atk')) dmg *= 1.1;         // 强化期间自身易伤
  if (has(dst, 'shield')) {                     // 护盾吸收
    const sh = dst.status.shield_v || 0;
    const use = Math.min(sh, dmg); dst.status.shield_v = sh - use; dmg -= use;
    if (dst.status.shield_v <= 0) delete dst.status.shield;
  }
  dmg = Math.max(1, Math.round(dmg));
  dst.hp = Math.max(0, dst.hp - dmg);
  src.dmgDone += dmg;
  src.rage = clamp(src.rage + C.RAGE_ON_HIT, 0, C.RAGE_MAX);
  dst.rage = clamp(dst.rage + C.RAGE_ON_TAKE, 0, C.RAGE_MAX);
  src.combo++; src.comboT = C.COMBO_TIMEOUT;
  src.maxCombo = Math.max(src.maxCombo, src.combo);
  dst.lastHitT = S.t;
  if (!has(dst, 'super_armor')) { dst.state = 'hurt'; dst.stateT = 0; dst.hurtT = C.HURT_FRAMES; }
  dst.invuln = 8;
  dst.vx += (src.facing || 1) * (opt.knock || 6);
  if (opt.launch) { dst.vy = opt.launch; dst.y -= 2; }
  if (opt.status) addStatus(dst, opt.status, opt.statusFrames || 40, opt.statusVal || 0);
  if (opt.mark) { dst.mark = 180; }
  // 被动：毒舌反伤
  if (pk.type === 'reflect') src.hp = Math.max(0, src.hp - Math.round(dmg * pk.val));
  // 替身：受击自动反击
  if (has(dst, 'counter_ready')) {
    delete dst.status.counter_ready;
    src.hp = Math.max(0, src.hp - Math.round(dmg * 0.6));
    floatAt(dst.x, dst.y - 130, '替身', [255, 160, 200]);
  }
  floatAt(dst.x, dst.y - 110, '-' + dmg, src.ch.aura);
  burst(dst.x, dst.y - 50, src.ch.aura, 12);
  if (opt.label) floatAt((src.x + dst.x) / 2, dst.y - 150, opt.label, [255, 208, 96]);
  return true;
}
function floatAt(x, y, text, col) {
  S.floats.push({ x: x, y: y, text: text, col: col, t: 46 });
  if (S.mode === 'online' && S.net.role === 'host') {
    S.netEvents.push({ x: Math.round(x), y: Math.round(y), text: text, col: col });
    if (S.netEvents.length > 30) S.netEvents.shift();
  }
}
function burst(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 1 + Math.random() * 4;
    S.particles.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1,
      col: col, t: 22 + Math.random() * 14 });
  }
}
function circleFx(x, y, r, col, t) { S.fx.push({ kind: 'ring', x: x, y: y, r: r, col: col, t: t || 18, max: t || 18 }); }

function cast(f, action) {
  if (S.over || S.paused || !canSkill(f) || f.busy > 0) return false;
  const sp = spec(f.cid, action);
  const cdKey = action;
  if ((f.cd[cdKey] || 0) > 0 || f.rage < (sp.rage || 0)) return false;
  f.rage -= sp.rage || 0;
  f.cd[cdKey] = sp.cd || 96;
  f.busy = (sp.startup || 4) + (sp.active || 6) + (sp.recovery || 10);
  f.pending.push({ t: sp.startup || 4, action: action, sp: sp });
  f.state = 'atk'; f.stateT = 0;
  floatAt(f.x, f.y - 124, sp.name || action, f.ch.aura);
  return true;
}
function resolveSkill(f, ps) {
  const sp = ps.sp, o = other(f), kit = kitOf(f.cid);
  const d = damageOf(f, sp);
  const linked = ps.action === kit.link_to && o.mark > 0 && sp.consume;
  let extra = 0, st = null, stF = 0, pierce = !!sp.pierce_armor;
  if (linked) {
    o.mark = 0;
    const lk = sp.link || {};
    extra = lk.dmg || 26; st = lk.status || 'stun'; stF = lk.frames || 25;
    pierce = pierce || !!lk.pierce_armor;
    floatAt(f.x, f.y - 160, '联动！', [255, 208, 96]);
  }
  const opt = { knock: sp.knock || 6, launch: sp.launch || 0, mark: !!sp.tag,
    status: sp.status || st, statusFrames: sp.status_frames || stF,
    pierceArmor: pierce, breakGuard: !!sp.break_guard, label: sp.name };
  let any = false;
  switch (sp.kind) {
    case 'proj': case 'ult_proj': {
      const n = sp.count || 1;
      for (let i = 0; i < n; i++) {
        S.proj.push({ x: f.x + f.facing * 40, y: f.y - 58 - i * 16,
          vx: f.facing * (sp.proj || 11), vy: 0, owner: f, dmg: d / n,
          col: f.ch.aura, label: sp.name, radius: sp.kind === 'ult_proj' ? 26 : 16,
          life: 110, opt: Object.assign({}, opt) });
      }
      circleFx(f.x + f.facing * 40, f.y - 58, 22, f.ch.aura, 14);
      break;
    }
    case 'dash_strike': {
      f.x = clamp(f.x + f.facing * 90, 60, CFG.W - 60);
      circleFx(f.x, f.y - 50, 60, f.ch.aura, 16);
      if (Math.abs(o.x - f.x) < (sp.reach || 124)) {
        any = hit(f, o, d + extra, Object.assign({}, opt));
        if (any && st) addStatus(o, st, stF);
      }
      break;
    }
    case 'aoe': case 'ult_aoe': {
      const r = sp.radius || 120;
      circleFx(f.x, f.y - 50, r, f.ch.aura, 22);
      if (Math.abs(o.x - f.x) < r) {
        any = hit(f, o, d + extra, Object.assign({}, opt));
        if (any && st) addStatus(o, st, stF);
      }
      break;
    }
    default: { // melee
      const r = sp.reach || 96;
      circleFx(f.x + f.facing * r * 0.5, f.y - 50, r * 0.6, f.ch.aura, 14);
      if (Math.abs(o.x - f.x) < r && Math.abs(o.y - f.y) < 130) {
        any = hit(f, o, d + extra, Object.assign({}, opt));
        if (any && st) addStatus(o, st, stF);
      }
    }
  }
  burst(f.x, f.y - 50, f.ch.aura, 14);
}

// 普攻 / 跳 / 闪避 / 净化 / 秘卷
function act(side, action) {
  if (S.over || S.paused) return;
  const f = S.f[side - 1]; if (!f || !canAct(f)) return;
  // 联网 guest：只把输入发给 host，不本地结算
  if (S.mode === 'online' && S.net.open && S.net.role === 'guest') {
    netSend({ k: 'in', a: action }); return;
  }
  doAct(f, action);
}
function doAct(f, action) {
  if (action === 'atk') {
    if (f.busy > 0 || (f.cd.atk || 0) > 0) return;
    f.cd.atk = C.ATK_STARTUP + C.ATK_ACTIVE + C.ATK_RECOVERY + C.ATK_CD;
    f.busy = C.ATK_STARTUP + C.ATK_ACTIVE + C.ATK_RECOVERY;
    f.state = 'atk'; f.stateT = 0; f.atkHit = false;
    f.pending.push({ t: C.ATK_STARTUP, action: 'atk', sp: { dmg: 42, reach: C.ATK_REACH, name: '普攻' } });
    circleFx(f.x + f.facing * 50, f.y - 50, 34, f.ch.aura, 10);
  } else if (action === 'jump') {
    if (f.y >= C.GROUND_Y - 1) { f.vy = C.JUMP_V; f.state = 'jump'; }
  } else if (action === 'dodge') {
    if (f.dodgeCd > 0) return;
    f.dodgeCd = Math.max(30, Math.round(C.DODGE_CD *
      (kitOf(f.cid).passive.type === 'dodge_cd' ? 1 - kitOf(f.cid).passive.val : 1)));
    f.dodgeInv = C.DODGE_INVULN; f.invuln = Math.max(f.invuln, C.DODGE_INVULN);
    f.x = clamp(f.x + (S.input.dir || -f.facing) * C.DODGE_DIST, 60, CFG.W - 60);
    f.state = 'dash'; f.stateT = 0;
    floatAt(f.x, f.y - 120, '闪避', [140, 235, 255]);
  } else if (action === 'cleanse') {
    if (f.cleanseCd > 0) return;
    f.cleanseCd = C.CLEANSE_CD;
    ['stun', 'slow', 'silence', 'sleep', 'mark'].forEach(n => { delete f.status[n]; delete f.status[n + '_v']; });
    f.mark = 0; addStatus(f, 'cleanse_immune', C.CLEANSE_IMMUNE);
    floatAt(f.x, f.y - 120, '净化', [140, 235, 200]);
  } else if (action === 'scroll') {
    if (f.scrollCd > 0) return;
    const sc = RULES.scrolls[S.scrollName] || RULES.scrolls['霸体'];
    f.scrollCd = sc.cd || C.SCROLL_CD_FALLBACK;
    const o = other(f);
    if (sc.kind === 'self') addStatus(f, sc.status, sc.frames || 180, sc.val || 0);
    else if (sc.kind === 'shield') addStatus(f, 'shield', sc.frames || 180, sc.val || 60);
    else if (sc.kind === 'rage') f.rage = clamp(f.rage + (sc.val || 80), 0, C.RAGE_MAX);
    else if (sc.kind === 'cleanse') { ['stun','slow','silence','sleep'].forEach(n=>delete f.status[n]); }
    else if (sc.kind === 'aoe') {
      circleFx(f.x, f.y - 50, sc.radius || 155, [255, 196, 72], 22);
      if (Math.abs(o.x - f.x) < (sc.radius || 155)) hit(f, o, sc.dmg || 20, { status: sc.status, statusFrames: sc.frames });
    } else if (sc.kind === 'proj') {
      S.proj.push({ x: f.x + f.facing * 40, y: f.y - 58, vx: f.facing * (sc.proj || 11), vy: 0,
        owner: f, dmg: sc.dmg || 35, col: [255, 196, 72], label: sc.name, radius: 16, life: 110,
        opt: { status: sc.status, statusFrames: sc.frames } });
    }
    floatAt(f.x, f.y - 130, '秘卷·' + sc.name, [255, 208, 96]);
  } else if (action === 'transform') {
    if (f.rage < C.TRANSFORM_COST || f.transform) return;
    f.rage = 0; f.transform = true; floatAt(f.x, f.y - 140, '变身！', [255, 208, 96]);
  } else if (action.indexOf('s') === 0 || action === 'ult') {
    cast(f, action);
  }
}

// ======================== 电脑 AI（与 v3.5 同思路：决策计数节流） ========================
function aiThink() {
  const bot = S.f[1], foe = S.f[0];
  if (!bot || !foe) return;
  S.aiTick++; const tick = S.aiTick;
  const dist = Math.abs(bot.x - foe.x);
  let held = 0; const acts = [];
  if (dist > C.AI_ENGAGE) held = bot.x < foe.x ? 1 : -1;
  else if (dist < 54 && tick % 8 < 2) held = bot.x < foe.x ? -1 : 1;
  if ((bot.status.stun || bot.status.silence || bot.status.sleep || bot.mark > 0) && bot.cleanseCd === 0)
    acts.push('cleanse');
  if (dist < C.AI_ENGAGE + 40 && foe.state === 'atk' && bot.dodgeCd === 0 && tick % C.AI_DODGE_EVERY === 0)
    acts.push('dodge');
  const free = s => (bot.cd[s] || 0) === 0;
  if (dist > C.AI_FAR) {
    if (free('s2')) acts.push('s2'); else if (free('s1')) acts.push('s1'); else if (free('s3')) acts.push('s3');
  } else if (dist > C.AI_ENGAGE) {
    if (free('s1')) acts.push('s1'); else if (free('s3')) acts.push('s3'); else if (free('s2')) acts.push('s2');
  } else {
    if (bot.rage >= C.AI_ULT_RAGE && free('ult') && tick % C.AI_ULT_EVERY === 0) acts.push('ult');
    if (free('s3')) acts.push('s3'); else if (free('s1')) acts.push('s1');
    else if (free('s2')) acts.push('s2'); else if ((bot.cd.atk || 0) === 0) acts.push('atk');
  }
  if (bot.scrollCd === 0 && tick % C.AI_SCROLL_EVERY === 0) acts.push('scroll');
  S.aiCache = { held: held, acts: acts };
}

// ======================== 场地机制 ========================
function tickArena() {
  const e = S.effect;
  if (e === 'center_rage' || e === 'heal_zone') {
    S.f.forEach(f => {
      if (Math.abs(f.x - CFG.W / 2) < 160) {
        if (e === 'center_rage' && S.t % 60 === 0) f.rage = clamp(f.rage + 10, 0, C.RAGE_MAX);
        if (e === 'heal_zone' && S.t % 60 === 0) f.hp = Math.min(f.maxHp, f.hp + f.maxHp * 0.006);
      }
    });
  }
  if (e === 'wind') { S.windDir = (Math.floor(S.t / 480) % 2) ? -1 : 1; S.f.forEach(f => f.vx += S.windDir * 0.9); }
  if (e === 'energy_orb') {
    if (!S.orb && S.t % 360 === 0) S.orb = { x: 300 + Math.random() * 680, y: C.GROUND_Y - 130 };
    if (S.orb) S.f.forEach(f => {
      if (Math.abs(f.x - S.orb.x) < 46 && Math.abs(f.y - 60 - S.orb.y) < 60) {
        f.hp = Math.min(f.maxHp, f.hp + 50); f.rage = clamp(f.rage + 40, 0, C.RAGE_MAX);
        floatAt(f.x, f.y - 140, '+能量', [140, 235, 200]); S.orb = null;
      }
    });
  }
}

// ======================== 每帧推进 ========================
function step() {
  if (S.paused || S.over || S.scene !== 'game') return;
  S.t++;
  S.timeLeft = Math.max(0, CFG.ROUND_SEC - S.t / CFG.FPS);

  // 联网 guest 不跑模拟，只渲染 host 下发的快照
  if (S.mode === 'online' && S.net.open && S.net.role === 'guest') { tickVisuals(); return; }

  // --- 输入 / AI ---
  const p1 = S.f[0], p2 = S.f[1];
  let d1 = S.input.dir;
  if (S.mode === 'online' && S.net.open && S.net.role === 'host') d1 = S.input.dir;
  let d2 = 0;
  if (S.mode === 'solo') {
    if (S.t % CFG.AI_THINK === 0) aiThink();
    d2 = S.aiCache.held;
    S.aiCache.acts.forEach(a => doAct(p2, a));
    S.aiCache.acts = [];
  } else if (S.mode === 'online') {
    d2 = S.net.remoteDir || 0;
  }

  // --- 计时器 ---
  S.f.forEach(f => {
    ['s1','s2','s3','ult','atk'].forEach(k => f.cd[k] = Math.max(0, (f.cd[k] || 0) - 1));
    f.dodgeCd = Math.max(0, f.dodgeCd - 1); f.cleanseCd = Math.max(0, f.cleanseCd - 1);
    f.scrollCd = Math.max(0, f.scrollCd - 1); f.busy = Math.max(0, f.busy - 1);
    f.invuln = Math.max(0, f.invuln - 1); f.dodgeInv = Math.max(0, f.dodgeInv - 1);
    f.hurtT = Math.max(0, f.hurtT - 1); f.comboT = Math.max(0, f.comboT - 1);
    if (f.comboT === 0) f.combo = 0;
    if (f.mark > 0) f.mark--;
    Object.keys(f.status).forEach(k => {
      if (k.indexOf('_v') >= 0) return;
      f.status[k] = Math.max(0, (f.status[k] || 0) - 1);
      if (f.status[k] === 0) { delete f.status[k]; delete f.status[k + '_v']; }
    });
    // 被动
    const kit = kitOf(f.cid), p = kit.passive;
    if (p.type === 'rage_tick' && S.t - f.lastHitT > 180 && S.t % (p.cd || 480) === 0)
      f.rage = clamp(f.rage + p.val, 0, C.RAGE_MAX);
    if (p.type === 'hp_tick' && S.t % (p.cd || 600) === 0)
      f.hp = Math.min(f.maxHp, f.hp + f.maxHp * p.val);
    if (p.type === 'shield_tick' && S.t % (p.cd || 720) === 0)
      addStatus(f, 'shield', 600, p.val);
    if (p.type === 'idle_charge') {
      if (Math.abs(f.vx) < 0.4 && f.busy === 0) f.idleT++; else f.idleT = 0;
      if (f.idleT > (p.cd || 120)) { f.charged = 1; f.idleT = 0; }
    }
    // 待结算技能
    const still = [];
    f.pending.forEach(ps => {
      ps.t--;
      if (ps.t > 0) { still.push(ps); return; }
      if (ps.action === 'atk') {
        const o = other(f);
        if (Math.abs(o.x - f.x) < ps.sp.reach && Math.abs(o.y - f.y) < 130)
          hit(f, o, damageOf(f, ps.sp), { label: f.ch.skills.normal, knock: 6 });
      } else resolveSkill(f, ps);
    });
    f.pending = still;
  });

  // --- 移动 / 物理 ---
  S.f.forEach((f, i) => {
    const d = i === 0 ? d1 : d2;
    const can = canAct(f) && f.busy === 0 && f.hurtT === 0;
    if (can && d !== 0) {
      let sp = C.MOVE_SPEED * (f.ch.stats.speed || 1);
      if (has(f, 'slow')) sp *= 0.62;
      if (has(f, 'buff_speed')) sp *= 1.15;
      if (f.transform) sp *= 1.2;
      if (S.effect === 'edge_slow' && (f.x < CFG.W * 0.15 || f.x > CFG.W * 0.85)) sp *= 0.75;
      f.x = clamp(f.x + d * sp, 60, CFG.W - 60);
      f.state = 'run';
    }
    f.guard = can && S.input.down && i === 0 && f.y >= C.GROUND_Y - 1;
    if (f.state === 'idle' || f.state === 'run' || f.state === 'guard' || f.state === 'jump') {
      const o = other(f); f.facing = o.x >= f.x ? 1 : -1;
    }
    const g = C.GRAVITY * (S.effect === 'low_gravity' ? 0.65 : 1);
    f.vy += g; f.y += f.vy; f.x += f.vx; f.vx *= 0.82;
    if (f.y >= C.GROUND_Y) { f.y = C.GROUND_Y; f.vy = 0; if (f.state === 'jump') f.state = 'idle'; }
    f.x = clamp(f.x, 60, CFG.W - 60);
    if (f.busy === 0 && f.hurtT === 0 && f.state !== 'jump') f.state = f.guard ? 'guard' : 'idle';
  });
  // 地面不能互相穿过；空中可以跳过绕背（与电脑版 v3.5 同一套扫掠检测）
  const a = S.f[0], b = S.f[1];
  if (a.y >= C.GROUND_Y - 2 && b.y >= C.GROUND_Y - 2) {
    const lim = C.BODY_W * 0.62;
    let d = b.x - a.x;
    const prev = S.prevD;
    if (prev !== undefined && prev * d < 0 && Math.abs(d) < C.BODY_W * 3) {
      // 一帧内左右关系翻转 = 穿过去了，按翻转前的次序拉回最小间距
      const sign = prev > 0 ? 1 : -1, mid = (a.x + b.x) / 2;
      a.x = mid - sign * lim / 2; b.x = mid + sign * lim / 2;
    } else if (Math.abs(d) < lim) {
      const push = (lim - Math.abs(d)) / 2 * (d >= 0 ? 1 : -1);
      a.x -= push; b.x += push;
    }
    a.x = clamp(a.x, 60, CFG.W - 60); b.x = clamp(b.x, 60, CFG.W - 60);
    S.prevD = b.x - a.x;
  } else {
    S.prevD = b.x - a.x;   // 空中完全不推，保留绕背
  }
  tickArena();

  // --- 投射物 ---
  S.proj.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.life--;
    const o = other(p.owner);
    if (Math.abs(o.x - p.x) < p.radius + 24 && Math.abs(o.y - 58 - p.y) < 60) {
      if (hit(p.owner, o, p.dmg, p.opt || {})) p.life = 0;
    }
    if (p.x < 0 || p.x > CFG.W) p.life = 0;
  });
  S.proj = S.proj.filter(p => p.life > 0);
  tickVisuals();

  // --- 胜负 ---
  if (a.hp <= 0 || b.hp <= 0 || S.timeLeft <= 0) {
    let w = 0;
    if (a.hp <= 0 && b.hp > 0) w = 2; else if (b.hp <= 0 && a.hp > 0) w = 1;
    else w = (a.hp / a.maxHp) > (b.hp / b.maxHp) ? 1 : ((b.hp / b.maxHp) > (a.hp / a.maxHp) ? 2 : 0);
    finish(w);
  }
  // host 下发快照
  if (S.mode === 'online' && S.net.open && S.net.role === 'host' && S.t % CFG.SNAP_EVERY === 0) netSend({ k: 'snap', s: snapshot() });
}
function tickVisuals() {
  S.fx.forEach(e => e.t--); S.fx = S.fx.filter(e => e.t > 0);
  S.floats.forEach(e => { e.t--; e.y -= 0.7; }); S.floats = S.floats.filter(e => e.t > 0);
  S.particles.forEach(e => { e.x += e.vx; e.y += e.vy; e.vy += 0.18; e.t--; });
  S.particles = S.particles.filter(e => e.t > 0);
}
function snapshot() {
  const ev = S.netEvents.splice(0);
  return {
    t: S.t, tl: S.timeLeft, over: S.over, w: S.winner, orb: S.orb, ev: ev,
    f: S.f.map(f => ({ x: f.x, y: f.y, hp: f.hp, rage: f.rage, facing: f.facing,
      state: f.state, guard: f.guard, vy: f.vy, mark: f.mark, transform: f.transform,
      combo: f.combo, status: f.status, cid: f.cid })),
    p: S.proj.map(p => ({ x: p.x, y: p.y, vx: p.vx, col: p.col, r: p.radius })),
  };
}
function applySnapshot(s) {
  S.t = s.t; S.timeLeft = s.tl; S.over = s.over; S.winner = s.w; S.orb = s.orb;
  // guest 视角：host 的 P2 就是「我」，所以交换双方，自己的按键才对应自己的角色
  const order = S.net.role === 'guest' ? [1, 0] : [0, 1];
  order.forEach((src, dst) => {
    const d = s.f[src], f = S.f[dst]; if (!d || !f) return;
    ['x','y','hp','rage','facing','state','guard','vy','mark','transform','combo'].forEach(k => f[k] = d[k]);
    f.status = d.status || {};
    if (d.cid && f.cid !== d.cid) {
      const ch = RULES.characters.find(c => c.id === d.cid);
      if (ch) { f.cid = d.cid; f.ch = ch; }
    }
  });
  S.proj = (s.p || []).map(p => ({ x: p.x, y: p.y, vx: p.vx, col: p.col, radius: p.r || 16, life: 1 }));
  (s.ev || []).forEach(e => S.floats.push({ x: e.x, y: e.y, text: e.text, col: e.col, t: 46 }));
}
function finish(w) {
  if (S.over) return;
  S.over = true; S.winner = w;
  if (S.mode === 'solo') recordMatch(w);
  if (S.mode === 'online' && S.net.role === 'host') netSend({ k: 'snap', s: snapshot() });
  showOver(w);
}

// ======================== 渲染（Canvas 只画战斗画面，按键由 DOM 画） ========================
const cv = $('#cv'), ctx = cv.getContext('2d');
let VS = 1, VOX = 0, VOY = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = Math.max(1, Math.round(w * dpr)); cv.height = Math.max(1, Math.round(h * dpr));
  VS = Math.min(cv.width / CFG.W, cv.height / CFG.H);
  VOX = (cv.width - CFG.W * VS) / 2; VOY = (cv.height - CFG.H * VS) / 2;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

function drawFighter(f) {
  const col = f.ch.color, acc = f.ch.accent, aura = f.ch.aura;
  const x = f.x, y = f.y, dir = f.facing;
  ctx.save(); ctx.translate(x, y); ctx.scale(dir, 1);
  // 影子
  ctx.fillStyle = 'rgba(0,0,0,.38)'; ctx.beginPath(); ctx.ellipse(0, 2, 34, 9, 0, 0, 7); ctx.fill();
  // 腿
  ctx.fillStyle = '#f5e4d6'; [-13, 5].forEach(px => { ctx.fillRect(px, -34, 14, 34); });
  // 身体 / 裙
  ctx.fillStyle = rgb(col);
  ctx.beginPath(); ctx.moveTo(-26, -34); ctx.lineTo(26, -34); ctx.lineTo(17, -96); ctx.lineTo(-17, -96); ctx.closePath(); ctx.fill();
  ctx.fillStyle = rgba(acc, .85); ctx.fillRect(-18, -100, 36, 26);
  // 手臂
  ctx.fillStyle = rgba(acc, .9); ctx.fillRect(-34, -94, 13, 40); ctx.fillRect(21, -94, 13, 40);
  // 头
  ctx.fillStyle = '#fae8dc'; ctx.beginPath(); ctx.arc(0, -128, 27, 0, 7); ctx.fill();
  ctx.fillStyle = rgb(col); ctx.beginPath(); ctx.arc(0, -136, 29, Math.PI, 0); ctx.fill();
  ctx.fillRect(-29, -138, 58, 12);
  // 眼
  ctx.fillStyle = '#2a2a44'; [-10, 10].forEach(px => { ctx.beginPath(); ctx.arc(px, -126, 3.4, 0, 7); ctx.fill(); });
  // 角色标志物（8 位各一个几何符号）
  ctx.fillStyle = rgb(aura);
  const id = f.cid;
  if (id === 'deepseek') { ctx.beginPath(); ctx.moveTo(-26,-150); ctx.lineTo(-52,-172); ctx.lineTo(-44,-138); ctx.closePath(); ctx.fill(); }
  else if (id === 'chatgpt') { [-18,18].forEach(px=>{ctx.beginPath();ctx.moveTo(px,-152);ctx.lineTo(px*1.5,-192);ctx.lineTo(px+8,-154);ctx.closePath();ctx.fill();}); }
  else if (id === 'claude') { ctx.fillStyle='#604838'; ctx.fillRect(24,-108,32,26); }
  else if (id === 'gemini') { [-20,20].forEach(px=>{ctx.beginPath();ctx.moveTo(px,-150);ctx.lineTo(px*1.3,-182);ctx.lineTo(px+14,-152);ctx.closePath();ctx.fill();}); }
  else if (id === 'qwen') { ctx.beginPath(); ctx.arc(-40,-120,24,0.6,3.6); ctx.lineTo(-40,-120); ctx.fill(); }
  else if (id === 'kimi') { ctx.beginPath(); ctx.arc(38,-166,17,0,7); ctx.fill(); ctx.fillStyle=rgb(col); ctx.beginPath(); ctx.arc(45,-172,15,0,7); ctx.fill(); }
  else if (id === 'glm') { ctx.strokeStyle=rgb(aura); ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(34,-176);ctx.lineTo(62,-176);ctx.lineTo(34,-146);ctx.lineTo(62,-146);ctx.stroke(); }
  else { ctx.fillStyle='#785a46'; ctx.fillRect(38,-160,7,80); ctx.fillStyle=rgb(aura); ctx.beginPath(); ctx.moveTo(30,-172);ctx.lineTo(66,-184);ctx.lineTo(66,-150);ctx.closePath();ctx.fill(); }
  // 状态光环 / 变身
  if (f.transform) { ctx.strokeStyle = '#ffd060'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0,-70,56,0,7); ctx.stroke(); }
  if (has(f,'super_armor')||has(f,'buff_atk')) { ctx.strokeStyle='rgba(255,208,96,.7)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,-70,50,0,7); ctx.stroke(); }
  if (f.guard) { ctx.strokeStyle='rgba(120,190,255,.85)'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(0,-70,44,-1.1,1.1); ctx.stroke(); }
  if (f.mark > 0) { ctx.fillStyle='#ffd060'; ctx.beginPath(); ctx.arc(0,-182,6,0,7); ctx.fill(); }
  if (f.invuln > 0 && Math.floor(S.t/3)%2===0) { ctx.globalAlpha = .55; }
  ctx.restore();
}
function draw() {
  const arena = RULES.arenas[S.arenaIdx] || RULES.arenas[0];
  // 底色铺满，等比居中的世界之外不出现黑边
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = rgb(arena.top); ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(VS, 0, 0, VS, VOX, VOY);
  // 渐变背景
  const g = ctx.createLinearGradient(0, 0, 0, CFG.H);
  g.addColorStop(0, rgb(arena.top)); g.addColorStop(1, rgb(arena.bot));
  ctx.fillStyle = g; ctx.fillRect(-VOX/VS, -VOY/VS, cv.width/VS, cv.height/VS);
  // 地面 + 透视网格
  ctx.fillStyle = rgb(arena.ground); ctx.fillRect(0, C.GROUND_Y, CFG.W, CFG.H - C.GROUND_Y);
  ctx.strokeStyle = rgba(arena.grid, .3); ctx.lineWidth = 1;
  for (let i = -6; i <= 18; i++) {
    ctx.beginPath(); ctx.moveTo(CFG.W/2 + i*38, C.GROUND_Y); ctx.lineTo(CFG.W/2 + i*150, CFG.H); ctx.stroke();
  }
  for (let j = 0; j < 5; j++) {
    const yy = C.GROUND_Y + 14 + j*j*11;
    ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(CFG.W, yy); ctx.stroke();
  }
  // 场地装饰：气泡 / 书页 / 星点
  const deco = arena.deco || 'bubble';
  ctx.fillStyle = rgba(arena.grid, .35);
  for (let i = 0; i < 22; i++) {
    const px = (i * 137 + S.t * (deco === 'bubble' ? -0.4 : 0.18)) % CFG.W;
    const py = (i * 83 + Math.sin(S.t/60 + i)*14) % (C.GROUND_Y - 40);
    ctx.beginPath(); ctx.arc(px, py, 2 + i % 4, 0, 7); ctx.fill();
  }
  if (S.orb) { ctx.fillStyle = '#8cebc8'; ctx.beginPath(); ctx.arc(S.orb.x, S.orb.y, 14, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(140,235,200,.6)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(S.orb.x, S.orb.y, 22, 0, 7); ctx.stroke(); }
  // 特效环
  S.fx.forEach(e => { ctx.strokeStyle = rgba(e.col, Math.max(0, e.t/e.max)); ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r * (1.2 - e.t/e.max*0.6), 0, 7); ctx.stroke(); });
  // 投射物
  S.proj.forEach(p => { ctx.fillStyle = rgb(p.col || [255,255,255]); ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius || 16, 0, 7); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=2; ctx.stroke(); });
  // 角色
  S.f.forEach(f => { if (f) drawFighter(f); });
  // 粒子
  S.particles.forEach(p => { ctx.fillStyle = rgba(p.col, Math.max(0, p.t/30)); ctx.fillRect(p.x, p.y, 3, 3); });
  // 浮字
  S.floats.forEach(e => { ctx.font = 'bold 22px system-ui,sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = rgba(e.col, Math.max(0, e.t/46)); ctx.fillText(e.text, e.x, e.y); });
  // 暂停 / 结束遮罩由 DOM 弹层承担，这里只画一层淡色
  ctx.setTransform(1,0,0,1,0,0);
  if (S.paused) { ctx.fillStyle='rgba(8,11,26,.55)'; ctx.fillRect(0,0,cv.width,cv.height); }
}

// ======================== HUD / 按钮状态 ========================
const ACT_LABEL = { atk:'普攻', s1:'技1', s2:'技2', s3:'技3', ult:'奥义',
  jump:'跳', dodge:'闪避', cleanse:'净化', scroll:'秘卷' };
function updateHUD() {
  const a = S.f[0], b = S.f[1]; if (!a || !b) return;
  $('#n1').textContent = 'P1 · ' + a.ch.short;
  $('#n2').textContent = (S.mode === 'online' ? '对手 · ' : '电脑 · ') + b.ch.short;
  $('#hp1').style.width = (a.hp/a.maxHp*100) + '%';
  $('#hp2').style.width = (b.hp/b.maxHp*100) + '%';
  [a,b].forEach((f,i)=>{
    const bars = $$('#rg'+(i+1)+' b');
    bars.forEach((el,j)=>el.classList.toggle('on', f.rage >= (j+1)*C.RAGE_PER_GRID - 10));
  });
  $('#clock').textContent = Math.ceil(S.timeLeft);
  $('#meta').textContent = (S.mode==='online'?'联网 1v1':'单人 PVE') + ' · ' +
    (RULES.arenas[S.arenaIdx].name) + ' · ' + (RULES.arena_effects[S.effect].name) + ' · ' + S.scrollName;
  const kit = kitOf(a.cid);
  $('#skillbar').innerHTML = ['s1','s2','s3','ult'].map(s =>
    '<b>'+ACT_LABEL[s]+'</b> '+spec(a.cid,s).name).join('　') +
    '　|　联动 <b>'+kit.link_from+'→'+kit.link_to+'</b>：'+kit.link_desc;
  // 圆键 / 胶囊：名称 + CD + 气不足
  $$('#keys .rk, #funcs .cap').forEach(el => {
    const ac = el.dataset.act; if (!ac) return;
    const f = a;
    let cd = 0, need = 0;
    if (ac === 'dodge') cd = f.dodgeCd;
    else if (ac === 'cleanse') cd = f.cleanseCd;
    else if (ac === 'scroll') cd = f.scrollCd;
    else if (ac === 'atk') cd = f.cd.atk;
    else if (ac !== 'jump') { cd = f.cd[ac] || 0; need = spec(f.cid, ac).rage || 0; }
    const lack = need > 0 && f.rage < need;
    el.classList.toggle('cd', cd > 0 || lack);
    const num = el.querySelector('.cdnum');
    if (num) num.textContent = cd > 0 ? (cd/CFG.FPS).toFixed(1) : (lack ? '缺气' : '');
    // 大字 = 角色专属短名（白饭 / 飞弹 / 鲸尾…），小字 = 键盘键名
    const lab = el.querySelector('.lab');
    if (lab && (ac === 's1' || ac === 's2' || ac === 's3')) lab.textContent = shortName(f.cid, ac);
    const small = el.querySelector('small');
    if (small) small.textContent =
      ({s1:'U',s2:'I',s3:'O',ult:'L',atk:'J',jump:'K',dodge:'Q',cleanse:'E',scroll:'Z'})[ac] || '';
  });
}

// ======================== 输入：DOM 指针 + 键盘 ========================
function bindPress(el, fn) {
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); el.classList.add('hot');
    try { el.setPointerCapture(e.pointerId); } catch (x) {}
    fn(e);
  });
  const off = e => { el.classList.remove('hot'); };
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('lostpointercapture', off);
}
$$('#keys .rk, #funcs .cap').forEach(el => bindPress(el, () => act(1, el.dataset.act)));

// 固定摇杆：底盘不动，只有头跟手指；多指互不干扰
const pad = $('#pad'), knob = $('#knob');
let stickId = null;
function stickMove(e) {
  const r = pad.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  let dx = (e.clientX - cx) / (r.width/2), dy = (e.clientY - cy) / (r.height/2);
  const len = Math.hypot(dx, dy); if (len > 1) { dx /= len; dy /= len; }
  knob.style.left = (50 + dx * 30) + '%'; knob.style.top = (50 + dy * 30) + '%';
  S.input.dir = Math.abs(dx) < CFG.STICK_DEAD ? 0 : (dx > 0 ? 1 : -1);
  S.input.up = dy < -0.6; S.input.down = dy > 0.6;
  if (S.mode === 'online' && S.net.open && S.net.role === 'guest') netSend({ k: 'dir', d: S.input.dir });
}
pad.addEventListener('pointerdown', e => {
  e.preventDefault(); stickId = e.pointerId;
  try { pad.setPointerCapture(e.pointerId); } catch (x) {}
  stickMove(e);
});
pad.addEventListener('pointermove', e => { if (e.pointerId === stickId) stickMove(e); });
function stickEnd(e) {
  if (e.pointerId !== stickId) return;
  stickId = null; S.input.dir = 0; S.input.up = S.input.down = false;
  knob.style.left = '50%'; knob.style.top = '50%';
  if (S.mode === 'online' && S.net.open && S.net.role === 'guest') netSend({ k:'dir', d:0 });
}
pad.addEventListener('pointerup', stickEnd);
pad.addEventListener('pointercancel', stickEnd);
pad.addEventListener('lostpointercapture', stickEnd);

// 键盘：电脑调试 / 外接键盘（4399 习惯），不影响手机 DOM 按键
const KEY1 = { j:'atk', k:'jump', u:'s1', i:'s2', o:'s3', l:'ult', q:'dodge', e:'cleanse', z:'scroll' };
const KEY2 = { '1':'atk','2':'jump','4':'s1','5':'s2','6':'s3','3':'ult','7':'dodge','8':'cleanse','9':'scroll' };
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'escape') { toggleOverlay('ovMenu'); return; }
  if (k === 'p') { togglePause(); return; }
  if (S.scene !== 'game') return;
  if (KEY1[k]) { act(1, KEY1[k]); e.preventDefault(); }
  if (KEY2[k]) { act(2, KEY2[k]); e.preventDefault(); }
  if (k === 'a') S.input.dir = -1;
  if (k === 'd') S.input.dir = 1;
  if (k === 's') S.input.down = true;
  if (k === 'w') S.input.up = true;
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'a' || k === 'd') S.input.dir = 0;
  if (k === 's') S.input.down = false;
  if (k === 'w') S.input.up = false;
});

// ======================== 房间码联网（WebRTC DataChannel） ========================
/* 同步方案：host 跑权威模拟，每 2 帧把双方快照发给 guest；
   guest 只上行输入、渲染下发状态。两台手机各显示各的屏幕，
   不再把 P1/P2 两套按键挤在同一块屏上。 */
function netSend(o) {
  const dc = S.net.dc;
  if (dc && dc.readyState === 'open') { try { dc.send(JSON.stringify(o)); } catch (e) {} }
}
function netStatus(txt) { const el = $('#netStatus'); if (el) el.textContent = txt; }
function pcMake() {
  const pc = new RTCPeerConnection({ iceServers: CFG.ICE[0].iceServers });
  return pc;
}
async function waitIce(pc) {
  if (pc.iceGatheringState === 'complete') return;
  await new Promise(res => {
    const chk = () => { if (pc.iceGatheringState === 'complete') { pc.removeEventListener('icegatheringstatechange', chk); res(); } };
    pc.addEventListener('icegatheringstatechange', chk);
    setTimeout(res, 6000);   // 兜底：某些网络下 gathering 很慢
  });
}
function wireDC(dc) {
  S.net.dc = dc;
  dc.onopen = () => {
    S.net.open = true; netStatus('已连接 · ' + S.net.role + ' · 房间 ' + S.net.room);
    toast('联机成功，开打！'); startMatch();
    if (S.net.role === 'guest') netSend({ k: 'char', cid: RULES.characters[S.charIdx].id });
  };
  dc.onmessage = e => {
    let m; try { m = JSON.parse(e.data); } catch (x) { return; }
    if (S.net.role === 'guest' && m.k === 'snap') {
      applySnapshot(m.s);
      if (m.s.over && $('#ovOver').hidden) showOver(m.s.w);
    }
    else if (S.net.role === 'host' && m.k === 'in') doAct(S.f[1], m.a);
    else if (S.net.role === 'host' && m.k === 'dir') S.net.remoteDir = m.d;
    else if (S.net.role === 'host' && m.k === 'char') {
      // 客人自选角色：换掉房主这边的 P2（血量按比例保持）
      const ch = RULES.characters.find(c => c.id === m.cid);
      if (ch && S.f[1]) {
        const r = S.f[1].hp / S.f[1].maxHp;
        S.f[1].cid = ch.id; S.f[1].ch = ch;
        S.f[1].maxHp = C.BASE_HP * (ch.stats.hp || 1);
        S.f[1].hp = S.f[1].maxHp * r;
      }
    }
  };
  dc.onclose = () => { S.net.open = false; netStatus('连接断开'); toast('对手断开'); };
}
function signalSend(o) {
  if (S.net.ws && S.net.ws.readyState === 1) S.net.ws.send(JSON.stringify(o));
  else { S.net.buf.push(o); $('#sdpOut').value = JSON.stringify(o); }
}
function wsConnect(code, role) {
  if (!CFG.WORKER_URL) { netStatus('未配置信令 → 用下方「本机码 / 对方码」手动交换'); return; }
  const base = CFG.WORKER_URL.replace(/^http/, 'ws').replace(/\/$/, '');
  const ws = new WebSocket(base + '/ws?room=' + encodeURIComponent(code) + '&role=' + role);
  S.net.ws = ws;
  ws.onmessage = async e => {
    let m; try { m = JSON.parse(e.data); } catch (x) { return; }
    if (m.t === 'peer' && role === 'host') { netStatus('对手加入，正在建连…'); await hostOffer(); }
    if ((m.t === 'offer' || m.t === 'answer') && m.d) await netApply(m);
  };
  ws.onopen = () => { netStatus('信令已连接 · 房间 ' + code + ' · 等待对手');
    S.net.buf.splice(0).forEach(o => ws.send(JSON.stringify(o))); };
  ws.onerror = () => netStatus('信令连不上，请检查 WORKER_URL 或用手动交换');
}
async function hostOffer() {
  const pc = pcMake(); S.net.pc = pc;
  const dc = pc.createDataChannel('aimf'); wireDC(dc);
  const off = await pc.createOffer(); await pc.setLocalDescription(off); await waitIce(pc);
  const payload = { t:'offer', d: pc.localDescription, room:S.net.room, from:'host' };
  signalSend(payload); $('#sdpOut').value = JSON.stringify(payload);
  netStatus('已发送本机码，等对方应答');
}
async function netApply(m) {
  let pc = S.net.pc;
  if (!pc) { pc = pcMake(); S.net.pc = pc;
    pc.ondatachannel = e => wireDC(e.channel); }
  if (m.t === 'offer') {
    await pc.setRemoteDescription(m.d);
    const ans = await pc.createAnswer(); await pc.setLocalDescription(ans); await waitIce(pc);
    const payload = { t:'answer', d: pc.localDescription, room:S.net.room, from:'guest' };
    signalSend(payload); $('#sdpOut').value = JSON.stringify(payload);
    netStatus('已回应对手，正在打通…');
  } else {
    await pc.setRemoteDescription(m.d); netStatus('应答已应用，正在打通…');
  }
}
function roomCode() {
  const s = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let r = ''; for (let i = 0; i < 4; i++) r += s[Math.floor(Math.random()*s.length)];
  return r;
}
$('#btnHost').addEventListener('click', () => {
  S.net.role = 'host'; S.net.room = ($('#roomCode').value || roomCode()).toUpperCase();
  $('#roomCode').value = S.net.room;
  S.mode = 'online'; S.net.remoteDir = 0;
  netStatus('房间 ' + S.net.room + ' 已创建，把房间码发给对手');
  if (CFG.WORKER_URL) wsConnect(S.net.room, 'host');
  else { hostOffer(); netStatus('未配置信令：把下方「本机码」发给对手，再把「对方码」粘回来'); }
  toast('房间 ' + S.net.room);
});
$('#btnJoin').addEventListener('click', () => {
  const c = ($('#roomCode').value || '').trim().toUpperCase();
  if (c.length < 4) { toast('请输入 4 位房间码'); return; }
  S.net.role = 'guest'; S.net.room = c; S.mode = 'online';
  netStatus('加入房间 ' + c + '，等待主机…');
  if (CFG.WORKER_URL) wsConnect(c, 'guest');
  else netStatus('未配置信令：把房主的「本机码」粘进下方框，点「应用对方码」');
});
$('#btnSdp').addEventListener('click', async () => {
  try {
    const m = JSON.parse($('#sdpIn').value.trim());
    if (!m.d) { toast('对方码格式不对'); return; }
    if (!S.net.role) S.net.role = m.t === 'offer' ? 'guest' : 'host';
    await netApply(m);
    if (m.t === 'offer') { /* netApply 已生成 answer 并写进 sdpOut */ }
    toast('已应用对方码');
  } catch (e) { toast('解析失败：' + e.message); }
});
function netDisconnect() {
  try { if (S.net.dc) S.net.dc.close(); } catch(e){}
  try { if (S.net.pc) S.net.pc.close(); } catch(e){}
  try { if (S.net.ws) S.net.ws.close(); } catch(e){}
  S.net = { role:'', room:'', ws:null, pc:null, dc:null, open:false, buf:[] };
}

// ======================== 页面 / 弹层 ========================
// 兼容两种写法：'ovMenu' 与 '#ovMenu' 都能用（startMatch 里传的是不带 # 的）
const ovEl = id => document.querySelector(id.charAt(0) === '#' ? id : '#' + id);
function show(id) { ovEl(id).hidden = false; }
function hide(id) { ovEl(id).hidden = true; }
function toggleOverlay(id) {
  const el = ovEl(id); el.hidden = !el.hidden;
  if (!el.hidden && (id === 'ovStats' || id === '#ovStats')) renderStats();
}
$$('[data-close]').forEach(b => b.addEventListener('click', () => hide('#' + b.dataset.close)));
$$('.ov').forEach(o => o.addEventListener('pointerdown', e => { if (e.target === o && o.id !== 'ovOver') o.hidden = true; }));

function buildChips() {
  const cr = $('#charRow'); cr.innerHTML = '';
  RULES.characters.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'chip' + (i === S.charIdx ? ' on' : '');
    b.textContent = c.short; b.dataset.i = i;
    b.addEventListener('click', () => { S.charIdx = i; buildChips(); });
    cr.appendChild(b);
  });
  $('#charName').textContent = '· ' + RULES.characters[S.charIdx].name + ' — ' + RULES.characters[S.charIdx].lore;
  const ar = $('#arenaRow'); ar.innerHTML = '';
  RULES.arenas.forEach((a, i) => {
    const b = document.createElement('button');
    b.className = 'chip' + (i === S.arenaIdx ? ' on' : '');
    b.textContent = a.name; b.title = a.desc;
    b.addEventListener('click', () => { S.arenaIdx = i; buildChips(); });
    ar.appendChild(b);
  });
  const er = $('#effRow'); er.innerHTML = '';
  Object.keys(RULES.arena_effects).forEach(k => {
    const b = document.createElement('button');
    b.className = 'chip' + (k === S.effect ? ' on' : '');
    b.textContent = RULES.arena_effects[k].name; b.title = RULES.arena_effects[k].desc;
    b.addEventListener('click', () => { S.effect = k; buildChips(); });
    er.appendChild(b);
  });
  const sr = $('#scrollRow'); sr.innerHTML = '';
  Object.keys(RULES.scrolls).forEach(k => {
    const b = document.createElement('button');
    b.className = 'chip' + (k === S.scrollName ? ' on' : '');
    b.textContent = k; b.title = RULES.scrolls[k].desc;
    b.addEventListener('click', () => { S.scrollName = k; buildChips(); });
    sr.appendChild(b);
  });
  $('#menuHint').innerHTML = '当前：<b>' + (S.mode === 'online' ? '联网 1v1' : '单人 PVE') + '</b> · ' +
    RULES.arenas[S.arenaIdx].name + ' · ' + RULES.arena_effects[S.effect].name + ' · 秘卷 ' + S.scrollName +
    '<br>手机版默认只显示 P1 一套按键；P2 由电脑或远端玩家控制，不再同屏挤两套。';
}
$$('#modeRow .chip').forEach(b => b.addEventListener('click', () => {
  $$('#modeRow .chip').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); S.mode = b.dataset.mode;
  if (S.mode === 'online') show('#ovNet');
  buildChips();
}));
function renderHelp() {
  const kit = kitOf(RULES.characters[S.charIdx].id);
  const names = ['s1','s2','s3','ult'].map(s => spec(RULES.characters[S.charIdx].id, s).name);
  $('#helpBody').innerHTML =
    '<b>手机操作</b><br>左下固定摇杆＝左右移动（上＝上挑修饰，下＝防御）；' +
    '右下大圆＝普攻，3 个圆＝角色专属技能，金色圆＝奥义；' +
    '左下 2×2 胶囊＝跳 / 闪避 / 净化 / 秘卷。所有按键按真实手机像素绘制，不再从电脑布局缩小。<br><br>' +
    '<b>' + RULES.characters[S.charIdx].short + ' 的四个技能</b><br>' +
    names.map((n,i)=>(['技1','技2','技3','奥义'][i])+'　'+n).join('<br>') +
    '<br>联动 <b>' + kit.link_from + ' → ' + kit.link_to + '</b>：' + kit.link_desc + '<br><br>' +
    '<b>键盘（电脑调试 / 外接键盘）</b><br>P1：A/D 移动，W 上挑，S 防御，J 普攻，K 跳，U/I/O 技1~3，L 奥义，Q 闪避，E 净化，Z 秘卷，P 暂停，Esc 菜单。<br>' +
    'P2：数字 1/2 攻跳，4/5/6 技，3 奥义，7/8/9 功能，方向键移动。<br><br>' +
    '<b>规则</b><br>每格气 100，奥义耗 2 格且 CD 长；闪避 CD 约 ' + (C.DODGE_CD/CFG.FPS).toFixed(1) +
    ' 秒、有无敌帧，专门躲技能；净化解控并短时免控；秘卷在菜单里换。' +
    '地面不能穿过对手，跳起来可越过绕背。PVE 电脑会靠近、放远程技、贴脸连招、被控净化。<br><br>' +
    '<b>联网</b><br>菜单 → 房间码联机：一人「创建房间」，另一人输同一房间码「加入」。' +
    '两台手机各管各的角色，不再同屏。部署 Cloudflare Worker 后自动连；没部署就把「本机码」发给对方、粘回「对方码」。<br><br>' +
    '<b>右上角</b>「暂停 / 菜单」收起了原来挤在屏幕中间的 5 个按钮；菜单里可换角色、场地、机制、秘卷、看战绩。';
}
function renderStats() {
  const st = S.stats, box = $('#statsBody');
  box.innerHTML = ['P1','P2'].map(k => {
    const s = st[k], rate = s.matches ? Math.round(s.wins/s.matches*100) : 0;
    const top = Object.entries(s.chars).sort((a,b)=>b[1]-a[1])[0];
    const cn = top ? (RULES.characters.find(c=>c.id===top[0])||{short:top[0]}).short : '—';
    return '<h2>'+k+'</h2>对局 <b>'+s.matches+'</b> 场 · 胜 <b>'+s.wins+'</b> 场 · 胜率 <b>'+rate+'%</b><br>' +
      '累计伤害 <b>'+s.dmg+'</b> · 最大连击 <b>'+s.maxCombo+'</b> · 常用角色 <b>'+cn+'</b><br>' +
      '最近：' + (s.recent.length ? s.recent.slice(0,5).map(r=> (r.w===Number(k.slice(1))?'胜':'负')).join(' / ') : '暂无');
  }).join('');
}
function showOver(w) {
  $('#overTitle').textContent = w === 0 ? '平局' : (w === 1 ? 'P1 胜利' : 'P2 胜利');
  $('#overSub').textContent = (S.mode === 'online' ? '联网 1v1' : '单人 PVE') + ' · ' +
    RULES.arenas[S.arenaIdx].name + ' · 用时 ' + Math.round(CFG.ROUND_SEC - S.timeLeft) + ' 秒';
  show('#ovOver');
}
function startMatch() {
  ['ovMenu','ovHelp','ovNet','ovStats','ovOver'].forEach(hide);
  const c1 = RULES.characters[S.charIdx].id;
  let c2 = RULES.characters[S.p2CharIdx].id;
  if (S.mode === 'online' && S.net.role === 'guest') c2 = RULES.characters[0].id;
  S.f = [ makeF(1, c1, CFG.W * 0.28), makeF(2, c2, CFG.W * 0.72) ];
  S.proj = []; S.fx = []; S.floats = []; S.particles = [];
  S.t = 0; S.timeLeft = CFG.ROUND_SEC; S.over = false; S.winner = 0;
  S.paused = false; S.aiTick = 0; S.aiCache = { held:0, acts:[] };
  S.orb = null; S.prevD = undefined; S.netEvents = [];
  S.input.dir = 0; S.input.up = S.input.down = false;
  S.scene = 'game';
  $('#btnPause').textContent = '暂停';
  toast(S.mode === 'online' ? '联网对局开始' : '开打！');
}
function togglePause() {
  if (S.scene !== 'game') return;
  S.paused = !S.paused;
  $('#btnPause').textContent = S.paused ? '继续' : '暂停';
  toast(S.paused ? '已暂停' : '继续');
}
$('#btnStart').addEventListener('click', () => { S.mode = 'solo'; netDisconnect(); startMatch(); });
$('#btnNet').addEventListener('click', () => { show('#ovNet'); });
$('#btnPause').addEventListener('click', togglePause);
$('#btnMenu').addEventListener('click', () => { toggleOverlay('ovMenu'); buildChips(); });
$('#btnHelp').addEventListener('click', () => { renderHelp(); show('#ovHelp'); });
$('#btnStats').addEventListener('click', () => { renderStats(); show('#ovStats'); });
$('#btnClear').addEventListener('click', () => {
  if (!confirm('确定清空 P1 / P2 全部战绩？')) return;
  S.stats = { P1: blankSide(), P2: blankSide() }; saveStats(); renderStats(); toast('战绩已清空');
});
$('#btnAgain').addEventListener('click', startMatch);
$('#btnBack').addEventListener('click', () => {
  S.scene = 'menu'; hide('#ovOver'); netDisconnect(); show('#ovMenu'); buildChips();
});

// ======================== 主循环 ========================
let acc = 0, last = now();
function loop(ts) {
  const dt = Math.min(100, ts - last); last = ts; acc += dt;
  const stepMs = 1000 / CFG.FPS;
  let guard = 0;
  while (acc >= stepMs && guard++ < 5) { step(); acc -= stepMs; }
  if (S.f[0]) { draw(); updateHUD(); }
  requestAnimationFrame(loop);
}

// ======================== 启动 ========================
S.stats = loadStats();
resize();
buildChips();
S.f = [ makeF(1, RULES.characters[0].id, CFG.W*0.28), makeF(2, RULES.characters[1].id, CFG.W*0.72) ];
show('#ovMenu');
requestAnimationFrame(loop);

// 调试 / 自动化验收接口
window.__aimf = {
  S: S, C: C, CFG: CFG, RULES: RULES,
  act: act, doAct: doAct, step: step, startMatch: startMatch,
  snapshot: snapshot, applySnapshot: applySnapshot,
  netSend: netSend, wireDC: wireDC, netStatus: netStatus,
  togglePause: togglePause, buildChips: buildChips,
  help: renderHelp, stats: renderStats,
};
})();

</script>
